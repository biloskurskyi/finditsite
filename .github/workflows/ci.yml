name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finditsite
          POSTGRES_USER: finditsite
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finditsite"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost
      DB_NAME: finditsite
      DB_USER: finditsite
      DB_PASSWORD: ci-password
      DB_HOST: localhost
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: finditsite
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: finditsite/requirements*.txt
      - run: pip install -r requirements.txt -r requirements.dev.txt
      - run: ruff check .
      - run: python manage.py test
