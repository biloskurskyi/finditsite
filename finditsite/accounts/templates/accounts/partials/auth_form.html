{% load i18n %}
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
    <div class="field">
        <div class="reginfo">{{ field.label }}</div>
        {{ field }}
        {% if field.help_text %}
        <div class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>
        {% endif %}
        {{ field.errors }}
    </div>
    {% endfor %}
    <div class="buttonsubmit">
        <button type="submit">{% translate "Submit" %}</button>
    </div>
</form>
